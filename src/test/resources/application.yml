spring:
  datasource:
    url: jdbc:h2:mem:scheduler;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  kafka:
    bootstrap-servers: localhost:9092

app:
  kafka:
    topic: job-execution
    consumer-group: job-workers
  scheduler:
    enabled: false
  outbox:
    enabled: false
  worker:
    enabled: false
