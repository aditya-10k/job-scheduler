x-app-env: &app-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobscheduler
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: postgres
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  APP_KAFKA_TOPIC: job-execution
  APP_KAFKA_CONSUMER_GROUP: job-workers

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: jobscheduler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:4.0.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - kafka
    environment:
      <<: *app-env
      APP_SCHEDULER_ENABLED: "false"
      APP_OUTBOX_ENABLED: "false"
      APP_WORKER_ENABLED: "false"
    ports:
      - "8080:8080"

  scheduler-1:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - kafka
    environment:
      <<: *app-env
      APP_SCHEDULER_ENABLED: "true"
      APP_OUTBOX_ENABLED: "true"
      APP_WORKER_ENABLED: "false"
      APP_WORKER_INSTANCE_ID: scheduler-1

  scheduler-2:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - kafka
    environment:
      <<: *app-env
      APP_SCHEDULER_ENABLED: "true"
      APP_OUTBOX_ENABLED: "true"
      APP_WORKER_ENABLED: "false"
      APP_WORKER_INSTANCE_ID: scheduler-2

  worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - kafka
    environment:
      <<: *app-env
      APP_SCHEDULER_ENABLED: "false"
      APP_OUTBOX_ENABLED: "false"
      APP_WORKER_ENABLED: "true"
      APP_WORKER_INSTANCE_ID: worker-1

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - kafka
    environment:
      <<: *app-env
      APP_SCHEDULER_ENABLED: "false"
      APP_OUTBOX_ENABLED: "false"
      APP_WORKER_ENABLED: "true"
      APP_WORKER_INSTANCE_ID: worker-2

volumes:
  pgdata:
